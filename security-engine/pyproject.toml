[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "craftsec-engine"
version = "0.1.0"
description = "CRAFT-Sec local security research engine"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.0,<2"
]

[project.scripts]
craftsec = "craftsec.main:main"

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3",
  "transformers>=4.40,<6",
  "safetensors>=0.4,<1"
]
analyzers = [
  "semgrep>=1.80,<2",
  "bandit>=1.7,<2"
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.6,<0.18",
  "import-linter>=2,<3",
  "datamodel-code-generator>=0.25,<1",
  "build>=1.2,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/craftsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["craftsec"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["craftsec"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
